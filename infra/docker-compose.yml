# Local services. Start: docker compose -f infra/docker-compose.yml up -d
# Object storage for photos follows in P1 (S3-compatible, private EU bucket in production).
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: denkraum
      POSTGRES_PASSWORD: denkraum
      POSTGRES_DB: denkraum
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:
